name: Deploy Backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── CI: check code on runner before touching server ──
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

  # ── CD: deploy only if CI passes ──
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USER }}
          key: ${{ secrets.VPC_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"

            cd /opt/spill-the-bill/backend

            echo "── Pull latest code ──"
            git pull origin main

            echo "── Install dependencies ──"
            npm ci --ignore-scripts

            echo "── Generate Prisma client ──"
            npx prisma generate

            echo "── Run migrations ──"
            npx prisma migrate deploy

            echo "── Reload PM2 (zero-downtime) ──"
            pm2 reload spill-the-bill-be --update-env

            echo "── Health check ──"
            sleep 3
            curl -sf http://localhost:3000/health || (echo "Health check failed" && exit 1)

            echo "── Done ✓ ──"
